[package]
name = "st-live"
version.workspace = true
edition.workspace = true

[dependencies]
st-core.workspace = true
st-media.workspace = true
st-ml.workspace = true
st-job.workspace = true
st-appkit.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
base64 = "0.22"
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "model", "cache", "rustls_backend", "voice"] }
songbird = { version = "0.6.1", features = ["receive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
