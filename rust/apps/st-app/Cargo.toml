[package]
name = "st-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "StreamTranslator"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
st-core.workspace = true
st-media.workspace = true
st-ml.workspace = true
st-vision.workspace = true
st-job.workspace = true
st-appkit.workspace = true
st-live.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-notification = "2"
rfd = "0.15"
arboard = { version = "3", default-features = false }
base64 = "0.22"
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }
