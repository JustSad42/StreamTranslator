[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "3.0.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.14"
regex = "1"
realfft = "3"
rustfft = "6.4"
rayon = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ct2rs-sys = { version = "0.11.0", default-features = false, features = ["cuda", "cudnn", "cuda-dynamic-loading", "ruy"] }
sentencepiece = "0.14"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
ureq = { version = "3", features = ["json"] }
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
st-core = { path = "crates/st-core" }
st-media = { path = "crates/st-media" }
st-ml = { path = "crates/st-ml" }
st-vision = { path = "crates/st-vision" }
st-job = { path = "crates/st-job" }
st-appkit = { path = "crates/st-appkit" }
st-live = { path = "crates/st-live" }

[profile.release]
debug = 1
